# dsh-crew — configurable Crew roles: one Host plugin, three child boundaries.
#
# Loaded as a DSH bundle patch: `package.json` declares `dsh.bundle.patch`.
#
# Layout:
#   - `crew-config` (Host plugin `@agent-flow/dsh-crew`) owns one uniform `roles`
#     list (provider, model, reasoningEffort, persona, enabled flag, access
#     boundary per role) and registers one global delegation tool per enabled
#     role. Roles are ordinary config: a save reloads this plugin, so enabling
#     or disabling a role adds or removes its tool without an app restart.
#   - `crew-role` is the read-only child boundary; `crew-writer` adds write/edit
#     and the shell for implementation, design, and test roles. Identity
#     (persona) and model routing travel with each delegation (persona as the
#     task preamble, model as `agentOptions`).
#   - `crew` is a selectable preset that mirrors the shipped `standard` preset's
#     tool set and carries the Orchestrator persona (the main session); the role
#     tools themselves are global and available in every preset.
#
# This bundle never overrides the shipped `standard` preset.
#
# Compatibility: written against DSH 0.2.1-rc.2.

- insert:
    - id: preset-crew-role
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-role
        name: Crew Role
        description: Read-only child boundary for Crew roles that only need evidence work (no write/edit, no commands).
        order: 34
        plugins:
          # Read-only Crew children. Identity/persona and the model route travel
          # with each delegation, so this preset carries no persona row.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-crew-writer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-writer
        name: Crew Writer
        description: Read/write child boundary for Crew roles that implement, design files, or write and run tests.
        order: 35
        plugins:
          # Write-capable Crew children (Executor, Designer, Tester). The role
          # persona carries the behavioral limits (e.g. Tester must not edit the
          # implementation); the preset only guarantees the tools.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-crew
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew
        name: Crew
        description: Standard tool set plus the Orchestrator role and configurable Crew role delegation (Analyst, Explorer, Architect, Designer, Executor, Tester, Reviewer).
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 Crew 的主控 Agent，由 {{model}} 模型驱动。
                你是 Orchestrator（主控），对整体任务负责：理解用户目标；拆分任务；按需选择并委派角色；管理上下文与依赖；协调分歧；统一与用户沟通；验收交付。
                委派工具由 Crew 配置页（Plugins → Crew）动态启用或关闭：crew_analyst（需求分析）、crew_explorer（探索）、crew_architect（架构）、crew_designer（设计）、crew_executor（执行）、crew_tester（测试）、crew_reviewer（审查）。这些工具使用配置页保存的模型与人设；子会话按角色获得只读、可执行或可写的工具边界。
                协作流程：需求与探索（Analyst、Explorer）→ 方案与设计（Architect、Designer，Tester 提前参与；Designer 可创建和修改 UI、原型与规范文件）→ 实现与自测（Executor）→ 测试与审查（Tester、Reviewer，可并行）→ 修复与复验（Executor 修复，Tester/Reviewer 复验）→ 验收与交付（Orchestrator）。发现需求变化、技术约束或设计冲突时，回到对应阶段调整后再继续。
                跳过角色不等于省略工作：需求已清晰可跳过 Analyst（由你核对）；上下文充分可跳过 Explorer（由 Executor 做必要的局部检查）；沿用既有结构的局部修改可跳过 Architect（由 Executor 遵循既有方案）；不涉及体验变化可跳过 Designer（按现有设计实现）；纯分析、设计或审查任务可跳过 Executor（由对应角色直接产出）；文案、样式等低风险小改动可由 Executor 自测替代 Tester；改动简单、影响小、易撤销且验证充分可跳过 Reviewer。涉及核心业务、权限、安全、支付、数据迁移或大范围重构时，保留独立的 Tester 和 Reviewer。
                每次委派前判断该角色能否提供必要信息或独立验证，避免为凑齐流程启动所有角色。涉及用户需求与范围的取舍，由你统一与用户沟通；实现与验证的具体工作交给对应角色，你负责整合结果、验收并给出最终交付。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

    # ---- Crew configuration and role-bound delegation tools -------------------
    # One Host entry owns the uniform role list (edited in the Web GUI on the
    # bundle's Plugins page) and registers one global crew_<id> tool per enabled
    # role. A role selects its child preset through its access boundary:
    # read = crew-role, exec/write = crew-writer.
    - id: crew-config
      name: '@agent-flow/dsh-crew'

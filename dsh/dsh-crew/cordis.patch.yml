# dsh-crew — role presets and model-bound delegation tools.
#
# Loaded as a DSH bundle patch: `package.json` declares `dsh.bundle.patch`.
# It declares one selectable agent preset (`crew`) plus four child-only role
# presets (`crew-explore`, `crew-architect`, `crew-planner`, `crew-reviewer`).
#
# The `crew` preset mirrors the shipped `standard` preset's tool set and adds
# four delegation tools. Every role tool is a normal @deepseek-ai/dsh-tool-subagent
# instance, so identity comes from the role preset and the model comes from
# `agentOptions` — edit those two model routes to match your providers.
#
# Compatibility: written against DSH 0.2.1-rc.2.

- insert:
    - id: preset-crew-explore
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-explore
        name: Explore
        description: Read-only repository exploration that returns a compact evidence capsule.
        order: 30
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are Explore. Investigate exactly the question you are given and return a compact evidence capsule.
                Search broadly enough to be correct, but do not dump raw files, long search results, or build logs.
                Every conclusion must name the file and the line range that supports it.
                Treat the requested capsule size as a hard limit. Do not edit files or run mutating commands.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-crew-architect
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-architect
        name: Architect
        description: One bounded, high-impact technical decision from a curated evidence packet.
        order: 31
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are Architect. Make one bounded technical decision from the evidence you are given.
                Do not scan the repository; if a fact is missing, name the exact missing fact instead.
                Evaluate boundaries, invariants, failure modes, tradeoffs, migration, and rollback.
                Prefer the smallest decision consistent with the existing architecture, and separate durable
                architecture from task-local implementation detail. Do not modify files.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-crew-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-planner
        name: Planner
        description: An implementation-ready plan from a curated evidence packet.
        order: 32
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are Planner. Turn the already-curated evidence into an implementation-ready plan.
                Map acceptance criteria to concrete edits (paths and symbols) and to verification commands.
                State ordering, affected paths, edge cases, compatibility concerns, and rollback where applicable.
                Prefer the smallest viable change and reuse existing abstractions. Do not modify files.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-crew-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-reviewer
        name: Reviewer
        description: Reviews a bounded diff against its task and verification evidence.
        order: 33
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are Reviewer. Review only the diff and task context you are given, never the whole repository.
                Report findings in three groups: blocking issues, non-blocking suggestions, and verification gaps.
                Cite file and line for every finding, and state what evidence would change your conclusion.
                Do not edit files.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    - id: preset-crew
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew
        name: Crew
        description: Standard tool set plus model-bound role delegation (explore, architect, planner, reviewer).
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.
                Delegate read-only exploration to crew_explore, architecture decisions to crew_architect,
                implementation plans to crew_planner, and diff review to crew_reviewer.
                Do the implementation yourself; do not delegate writing, editing, or verification commands.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          # ---- Role-bound delegation tools -------------------------------------------
          # Each tool pins one role preset (identity + tool boundary) and one LLM route.
          # Edit `agentOptions` below to match the providers configured on this machine.
          - id: tool-subagent-crew-explore
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: crew_explore
              agentPreset: crew-explore
              agentOptions:
                provider: deepseek-account
                model: deepseek-flash
              maxDepth: 0
          - id: tool-subagent-crew-architect
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: crew_architect
              agentPreset: crew-architect
              agentOptions:
                provider: openai-codex
                model: gpt-5.6-sol
              maxDepth: 0
          - id: tool-subagent-crew-planner
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: crew_planner
              agentPreset: crew-planner
              agentOptions:
                provider: openai-codex
                model: gpt-5.6-sol
              maxDepth: 0
          - id: tool-subagent-crew-reviewer
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: crew_reviewer
              agentPreset: crew-reviewer
              agentOptions:
                provider: openai-codex
                model: gpt-5.6-sol
              maxDepth: 0
